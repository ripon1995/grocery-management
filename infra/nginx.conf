events {
    worker_connections 1024;
}

http {
    # Define the backend group of Docker API containers
    upstream grocery_api_cluster {
        server grocery-api-1:8000 max_fails=2 fail_timeout=5s;
        server grocery-api-2:8000 max_fails=2 fail_timeout=5s;
        server grocery-api-3:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name api.groceryapp.lb;

        location / {
            proxy_pass http://grocery_api_cluster;

            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;

            # Preserve original request details
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}