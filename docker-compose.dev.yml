# Dev stack: local postgres (migrated + seeded) instead of Supabase
# Usage: docker compose -f docker-compose.dev.yml up --build
name: grocery-management-dev # separate project so it doesn't clash with the prod stack

include:
  - ./docker/grocery-management-redis.yml
  - ./docker/grocery-management-postgres.yml

services:
  backend:
    build: ./backend # Location of the backend Dockerfile (terminology -> context file)
    container_name: grocery-api-dev # Custom container name
    ports:
      - "8000:8000" # Port mapping for host:container
    env_file:
      - ./backend/.env.dev # dev-only env (local postgres), see backend/.env.dev.sample
    depends_on:
      redis:
        condition: service_started
      db-init:
        condition: service_completed_successfully # wait for migrations + seed
    networks:
      - grocery-net # Connects backend to the custom network
    # ── Add resource limits here ─────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M


  frontend:
    build: ./frontend
    container_name: grocery-frontend-dev
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on: # by this it will tell to build backend first cause it depend on backend
      - backend
    networks:
      - grocery-net


networks:
  grocery-net: # Custom network name
    driver: bridge
