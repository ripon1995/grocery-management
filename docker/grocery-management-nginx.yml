services:
  nginx:
    image: nginx:alpine
    container_name: grocery_dev_nginx
    restart: always
    ports:
      - "80:80" # Exposed to the host as the primary entry point
    volumes:
      - ../infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - grocery-net

networks:
  grocery-net:
    driver: bridge