services:
  postgres:
    image: postgres:17-alpine
    container_name: grocery_dev_postgres
    restart: always
    environment:
      POSTGRES_USER: grocery_dev
      POSTGRES_PASSWORD: grocery_dev
      POSTGRES_DB: grocery-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - grocery-net

  # one-shot job: wait for DB -> migrate -> seed (see backend/scripts/seed_groceries.py)
  db-init:
    build: ../backend
    container_name: grocery_dev_db_init
    env_file:
      - ../backend/.env.dev # dev-only env (local postgres), see backend/.env.dev.sample
    environment:
      PYTHONUNBUFFERED: "1" # keep print() and alembic logs in order
    command: python -m scripts.seed_groceries
    depends_on:
      - postgres
    networks:
      - grocery-net

volumes:
  postgres_data:

networks:
  grocery-net: # Custom network name
    driver: bridge
